name: Haven Tests

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, dom, curl, zip, sqlite3, pdo_sqlite
          coverage: none
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Create environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Generate Ziggy routes
        run: php artisan ziggy:generate resources/js/ziggy.js

      - name: Run database migrations
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          INERTIA_SSR_ENABLED: 'false'
        run: php artisan migrate --force

      - name: Build Vue application
        env:
          INERTIA_SSR_ENABLED: 'false'
        run: npm run build

      - name: Run Laravel tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
          INERTIA_SSR_ENABLED: 'false'
        run: php artisan test

  deploy-test:
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Create deployment environment file
        shell: powershell
        run: Copy-Item .env.example .env -Force

      - name: Generate application key
        run: php artisan key:generate

      - name: Generate Ziggy routes
        run: php artisan ziggy:generate resources/js/ziggy.js

      - name: Build Vue application
        env:
          INERTIA_SSR_ENABLED: 'false'
        run: npm run build

      - name: Deploy Haven test site
        run: docker compose -f compose.test.yaml up -d --build

      - name: Run database migrations
        run: docker compose -f compose.test.yaml exec -T app php artisan migrate --force
