services:

    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile

        container_name: haven-app

        working_dir: /var/www/html

        volumes:
            - ./:/var/www/html

        networks:
            - haven


    nginx:
        image: nginx:alpine

        container_name: haven-nginx

        ports:
            - "8090:80"

        volumes:
            - ./:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

        depends_on:
            - app

        networks:
            - haven


networks:

    haven:
        driver: bridge
