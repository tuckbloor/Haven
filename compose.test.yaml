name: haven-test

services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: haven-test-app

    working_dir: /var/www/html

    volumes:
      - .:/var/www/html

    environment:
      APP_ENV: testing
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/testing.sqlite
      INERTIA_SSR_ENABLED: "false"

  nginx:
    image: nginx:alpine

    container_name: haven-test-nginx

    ports:
      - "8092:80"

    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app
